<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yt-summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0c0f;
      --surface:    #111418;
      --border:     #1e2530;
      --muted:      #3a4455;
      --text:       #c8d0de;
      --bright:     #eef2f8;
      --green:      #4ade80;
      --green-dim:  #1a3d28;
      --red:        #f87171;
      --accent:     #38bdf8;
      --accent-dim: #0c2d3f;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    .shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header { margin-bottom: 48px; }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .prompt-sigil {
      color: var(--green);
      font-size: 18px;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 42px);
      color: var(--bright);
      letter-spacing: -0.02em;
    }

    h1 span { color: var(--green); }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .label-row label { margin-bottom: 0; }

    .label-hint {
      font-size: 10px;
      color: var(--muted);
      opacity: 0.6;
      letter-spacing: 0.03em;
      text-transform: none;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      color: var(--bright);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    input::placeholder { color: var(--muted); }
    select option { background: var(--surface); }

    .model-row { display: flex; gap: 8px; }
    .model-row select { flex: 1; }

    .refresh-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, color 0.15s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 12px;
    }

    button#run-btn {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      border-radius: 4px;
      color: var(--green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button#run-btn:hover:not(:disabled) {
      background: #22543d;
      box-shadow: 0 0 12px rgba(74,222,128,0.2);
    }

    button#run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #log-section { display: none; }

    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      font-size: 12px;
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-line {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(4px);
      animation: fadein 0.2s forwards;
    }

    @keyframes fadein { to { opacity: 1; transform: translateY(0); } }

    .log-line .ts  { color: var(--muted); flex-shrink: 0; }
    .log-line .msg { color: var(--text); }
    .log-line.ok   .msg { color: var(--green); }
    .log-line.err  .msg { color: var(--red); }
    .log-line.info .msg { color: var(--accent); }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--muted);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #result-section { display: none; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #summary-output {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.75;
      word-break: break-word;
    }

    #summary-output :first-child { margin-top: 0; }
    #summary-output :last-child { margin-bottom: 0; }

    #summary-output h1, #summary-output h2, #summary-output h3,
    #summary-output h4, #summary-output h5, #summary-output h6 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      color: var(--bright);
      margin: 1.1em 0 0.45em;
      line-height: 1.25;
    }
    #summary-output h1 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
    #summary-output h2 { font-size: 1.25em; }
    #summary-output h3 { font-size: 1.1em; color: var(--accent); }

    #summary-output p { margin: 0.65em 0; }
    #summary-output ul, #summary-output ol { margin: 0.65em 0; padding-left: 1.5em; }
    #summary-output li { margin: 0.25em 0; }
    #summary-output li > p { margin: 0.25em 0; }

    #summary-output blockquote {
      margin: 0.75em 0;
      padding: 0.35em 0 0.35em 1em;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }

    #summary-output pre {
      margin: 0.85em 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: #06080c;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }
    #summary-output pre code { font-family: 'JetBrains Mono', monospace; }

    #summary-output :not(pre) > code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92em;
      padding: 0.12em 0.4em;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--green);
    }

    #summary-output a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
    }
    #summary-output a:hover { border-bottom-color: var(--accent); }

    #summary-output hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.25em 0;
    }

    #summary-output strong { color: var(--bright); font-weight: 600; }
    #summary-output em { font-style: italic; color: var(--text); }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

    #error-banner {
      display: none;
      background: #2d1515;
      border: 1px solid var(--red);
      border-radius: 4px;
      padding: 14px 16px;
      color: var(--red);
      font-size: 12px;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    #error-banner .err-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    footer {
      margin-top: 60px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    footer span { letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="prompt-line">
      <span class="prompt-sigil">▋</span>
      <span class="tagline">~/tools/yt-summarizer — bash</span>
    </div>
    <h1>yt<span>-summarizer</span></h1>
    <p class="tagline">// extract subtitles · clean · summarize with a local model</p>
  </header>

  <!-- LM Studio config -->
  <div class="section-label">// lm studio</div>
  <div class="card">
    <div class="field">
      <label>Server URL</label>
      <input type="text" id="base-url" value="http://localhost:1234/v1" />
    </div>
    <div class="field">
      <label>Model</label>
      <div class="model-row">
        <select id="model-select">
          <option value="">— connect to load models —</option>
        </select>
        <button class="refresh-btn" onclick="loadModels()" title="Refresh models">↻</button>
      </div>
    </div>
    <div class="field">
      <div class="label-row">
        <label>API Key</label>
        <span class="label-hint">optional · sent as Authorization: Bearer</span>
      </div>
      <input type="password" id="api-key" placeholder="leave blank if not required" autocomplete="off" />
    </div>
  </div>

  <!-- Video input -->
  <div class="section-label">// input</div>
  <div class="card">
    <div class="field">
      <label>YouTube URL</label>
      <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
    </div>
    <div class="field row">
      <div>
        <label>Subtitle Language</label>
        <input type="text" id="lang" value="en" />
      </div>
    </div>
    <button id="run-btn" onclick="runSummarize()">
      <span id="btn-icon">▶</span>
      <span id="btn-label">RUN</span>
    </button>
  </div>

  <!-- Log -->
  <div id="log-section">
    <div class="section-label">// process log</div>
    <div class="card" style="padding: 0;">
      <div class="log-box" id="log-box"></div>
    </div>
  </div>

  <!-- Error -->
  <div id="error-banner">
    <div class="err-label">error</div>
    <div id="error-msg"></div>
  </div>

  <!-- Result -->
  <div id="result-section">
    <div class="result-header">
      <div class="section-label" style="margin:0;">// summary</div>
      <button class="copy-btn" onclick="copySummary()">[ copy ]</button>
    </div>
    <div id="summary-output"></div>
  </div>

  <footer>
    <span>yt-summarizer v1.0</span>
    <span>powered by yt-dlp + lm studio</span>
  </footer>

</div>

<script>
  const $ = id => document.getElementById(id);

  let lastSummaryMarkdown = '';

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function safeHref(url) {
    const u = String(url).trim();
    if (/^https?:\/\//i.test(u)) return escapeHtml(u);
    if (/^mailto:[^\s"'<>]+$/i.test(u)) return escapeHtml(u);
    if (/^#[-.\w]*$/i.test(u)) return escapeHtml(u);
    return '#';
  }

  /** Inline markdown on an already HTML-escaped string. */
  function inlineMarkdown(escaped) {
    let s = escaped;
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, h) =>
      '<a href="' + safeHref(h) + '" rel="noopener noreferrer" target="_blank">' + t + '</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    return s;
  }

  function renderBlock(paragraph) {
    const raw = paragraph.trim();
    if (!raw) return '';

    const lines = paragraph.split(/\r?\n/);

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(raw)) return '<hr>';

    const singleLine = lines.length === 1 ? lines[0].trim() : '';
    const hm = singleLine.match(/^(#{1,6})\s+(.+)$/);
    if (hm) {
      const level = hm[1].length;
      return '<h' + level + '>' + inlineMarkdown(escapeHtml(hm[2])) + '</h' + level + '>';
    }

    const nonempty = lines.filter(l => l.trim());
    if (nonempty.length && nonempty.every(l => /^[-*]\s+/.test(l))) {
      const items = nonempty.map(l =>
        '<li>' + inlineMarkdown(escapeHtml(l.replace(/^[-*]\s+/, ''))) + '</li>');
      return '<ul>' + items.join('') + '</ul>';
    }
    if (nonempty.length && nonempty.every(l => /^\d+\.\s+/.test(l))) {
      const items = nonempty.map(l =>
        '<li>' + inlineMarkdown(escapeHtml(l.replace(/^\d+\.\s+/, ''))) + '</li>');
      return '<ol>' + items.join('') + '</ol>';
    }

    if (lines.every(l => !l.trim() || /^>\s?/.test(l))) {
      const inner = nonempty.map(l => l.replace(/^>\s?/, '')).join('\n');
      return '<blockquote>' + renderMarkdownBlocks(inner) + '</blockquote>';
    }

    const body = lines.map(l => inlineMarkdown(escapeHtml(l))).join('<br>');
    return '<p>' + body + '</p>';
  }

  function renderMarkdownBlocks(text) {
    return text
      .split(/\n{2,}/)
      .map(p => renderBlock(p))
      .filter(Boolean)
      .join('\n');
  }

  /** Minimal markdown → HTML (no external libs). Fenced code, lists, headers, links, emphasis. */
  function markdownToHtml(md) {
    const chunks = [];
    const fenceRe = /^```([\w-]*)\r?\n([\s\S]*?)\r?\n?```/gm;
    let last = 0;
    let m;
    while ((m = fenceRe.exec(md)) !== null) {
      if (m.index > last) chunks.push({ md: md.slice(last, m.index) });
      chunks.push({ html: '<pre><code>' + escapeHtml(m[2]) + '</code></pre>' });
      last = fenceRe.lastIndex;
    }
    if (last < md.length) chunks.push({ md: md.slice(last) });

    return chunks
      .map(part => (part.html ? part.html : renderMarkdownBlocks(part.md)))
      .join('\n');
  }

  function setSummaryFromMarkdown(markdown) {
    lastSummaryMarkdown = markdown;
    $('summary-output').innerHTML = markdownToHtml(markdown);
  }

  function timestamp() {
    return new Date().toLocaleTimeString('en-US', { hour12: false });
  }

  function log(msg, type = '') {
    const box = $('log-box');
    const line = document.createElement('div');
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="ts">[${timestamp()}]</span><span class="msg">${msg}</span>`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function setRunning(running) {
    const btn = $('run-btn');
    btn.disabled = running;
    $('btn-icon').innerHTML = running ? '<span class="spinner"></span>' : '▶';
    $('btn-label').textContent = running ? 'RUNNING...' : 'RUN';
  }

  function showError(msg) {
    $('error-msg').textContent = msg;
    $('error-banner').style.display = 'block';
  }

  function clearError() {
    $('error-banner').style.display = 'none';
    $('error-msg').textContent = '';
  }

  async function loadModels() {
    const baseUrl = $('base-url').value.trim();
    const apiKey  = $('api-key').value.trim();
    const sel     = $('model-select');
    sel.innerHTML = '<option value="">Loading…</option>';
    try {
      const params = new URLSearchParams({ base_url: baseUrl });
      if (apiKey) params.append('api_key', apiKey);
      const res  = await fetch(`/api/models?${params}`);
      const data = await res.json();
      if (data.models && data.models.length > 0) {
        sel.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join('');
      } else {
        sel.innerHTML = '<option value="">No models found — is LM Studio running?</option>';
      }
    } catch {
      sel.innerHTML = '<option value="">Could not connect to LM Studio</option>';
    }
  }

  async function runSummarize() {
    const url     = $('yt-url').value.trim();
    const lang    = $('lang').value.trim() || 'en';
    const baseUrl = $('base-url').value.trim();
    const model   = $('model-select').value;
    const apiKey  = $('api-key').value.trim();

    if (!url)   { showError('Please enter a YouTube URL.'); return; }
    if (!model) { showError('Please select a model (click ↻ to load models from LM Studio).'); return; }

    clearError();
    lastSummaryMarkdown = '';
    $('result-section').style.display = 'none';
    $('summary-output').innerHTML = '';
    $('log-section').style.display = 'block';
    $('log-box').innerHTML = '';
    setRunning(true);

    log('Initializing...', 'info');
    log(`Target URL: ${url}`);
    log(`Subtitle language: ${lang}`);
    log(`Model: ${model}`);
    if (apiKey) log('API key set — will send as Authorization: Bearer');
    log('Calling yt-dlp to fetch subtitles...');

    try {
      const res = await fetch('/api/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, lang, base_url: baseUrl, model, api_key: apiKey || null }),
      });

      let data;
      try {
        data = await res.json();
      } catch {
        log('Error: response was not valid JSON', 'err');
        showError('Server returned a non-JSON response. Check the Flask terminal for errors.');
        setRunning(false);
        return;
      }

      if (!res.ok || data.error) {
        log(`Error: ${data.error}`, 'err');
        showError(data.error);
        setRunning(false);
        return;
      }

      log('Subtitles downloaded and parsed.', 'ok');
      const tlen = data.transcript_length;
      if (typeof tlen === 'number') {
        log(`Transcript length: ${tlen.toLocaleString()} chars`);
      }
      log('Sending transcript to model...', 'info');
      log('Summary received.', 'ok');

      const summary =
        data.summary != null && typeof data.summary === 'string'
          ? data.summary
          : data.summary != null
            ? String(data.summary)
            : '';
      if (!summary.trim()) {
        const hint =
          'The server responded OK but the summary was empty. Often the local model returned null content — pick another model or check LM Studio.';
        log(hint, 'err');
        showError(hint);
        setRunning(false);
        return;
      }

      setSummaryFromMarkdown(summary);
      $('result-section').style.display = 'block';
      $('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      log(`Error: ${err.message}`, 'err');
      showError(err.message || String(err));
    }

    setRunning(false);
  }

  function copySummary() {
    const text = lastSummaryMarkdown || $('summary-output').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '[ copied! ]';
      setTimeout(() => btn.textContent = '[ copy ]', 2000);
    });
  }

  $('yt-url').addEventListener('keydown', e => { if (e.key === 'Enter') runSummarize(); });
  window.addEventListener('load', loadModels);
</script>
</body>
</html>
